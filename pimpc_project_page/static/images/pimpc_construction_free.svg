<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
<title>Construction-free: B-bar absorption decouples subproblems</title>
<defs>
  <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10264d" flood-opacity="0.09"/></filter>
  <marker id="aR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#e85d5d"/></marker>
  <marker id="aP" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#3b82f6"/></marker>
  <marker id="aG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#0f9d8a"/></marker>
<style><![CDATA[

text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#10264d}
.TTL{font-size:20px;font-weight:800;text-anchor:middle}
.SUB{font-size:12px;fill:#5d6b82;text-anchor:middle}
.tA{font-size:14px;font-weight:800;fill:#b91c1c;text-anchor:middle}
.tB{font-size:14px;font-weight:800;fill:#1d4ed8;text-anchor:middle}
.tC{font-size:14px;font-weight:800;fill:#065f46;text-anchor:middle}
.pA{fill:#fff7f5;stroke:#e85d5d;stroke-width:1.5;filter:url(#sh)}
.pB{fill:#f0f7ff;stroke:#3b82f6;stroke-width:1.5;filter:url(#sh)}
.pC{fill:#f0fdf9;stroke:#0f9d8a;stroke-width:1.5;filter:url(#sh)}
.eq{font-size:13px;font-family:Cambria Math,STIX Two Math,serif;text-anchor:middle}
.note{font-size:11px;fill:#5d6b82;text-anchor:middle}
.bad{fill:#ffedec;stroke:#e85d5d;stroke-width:1.1}
.good{fill:#dbeafe;stroke:#3b82f6;stroke-width:1.1}
.inv{fill:#dcfce7;stroke:#0f9d8a;stroke-width:1.2;filter:url(#sh)}
.kF{fill:#ffd5d3;stroke:#e85d5d;stroke-width:.8}
.k0{fill:#f1f5f9;stroke:#e2e8f0;stroke-width:.6}
.kL{font-size:9px;font-weight:700;text-anchor:middle;fill:#b91c1c}
.k0L{font-size:9px;text-anchor:middle;fill:#cbd5e1}
.dbad{fill:#ffeaea;stroke:#e85d5d;stroke-width:1}
.dbad-t{font-size:11px;font-weight:700;text-anchor:middle;fill:#b91c1c}
.dgood{fill:#e0fdf4;stroke:#0f9d8a;stroke-width:1}
.dgood-t{font-size:11px;font-weight:700;text-anchor:middle;fill:#065f46}
.once{fill:#0f9d8a}
.once-t{font-size:9px;font-weight:800;fill:white;text-anchor:middle}
.sumbar{fill:#eeeaff;stroke:#6d4aff;stroke-width:1.3}
.sumtxt{font-size:12px;font-weight:800;text-anchor:middle;fill:#4338ca}
.inv-name{font-size:16px;font-weight:800;text-anchor:middle;fill:#065f46}
.inv-eq{font-size:12px;font-weight:700;text-anchor:middle;fill:#065f46}
.inv-use{font-size:10px;text-anchor:middle;fill:#0f9d8a}
.red-key{font-size:12px;font-weight:800;fill:#b91c1c;text-anchor:middle}
.blue-key{font-size:13px;font-weight:800;fill:#1d4ed8;text-anchor:middle}

]]></style>
</defs>
<rect width="1200" height="480" fill="#f8fafc"/>
<text x="600" y="28" class="TTL" >Construction-free: absorbing B̅ into vₖ decouples Δu and x̅ subproblems</text>
<text x="600" y="46" class="SUB" >Standard: B̅ couples both gradients → N-growing KKT. πMPC (vₖ=B̅ₖΔuₖ): gradients separate → fixed-size inverses precomputed once.</text>
<rect x="16" y="56" width="310" height="370" rx="10" class="pA"/>
<text x="171" y="76" class="tA" >Standard  (vₖ = uₖ)</text>
<rect x="28" y="86" width="286" height="38" rx="5" class="bad"/>
<text x="171" y="99" class="eq" >ρ/2‖x̅ₖ₊₁−Āₖx̅ₖ−B̅ₖΔuₖ−ēₖ‖²</text>
<text x="171" y="118" class="note" fill="#b91c1c" font-weight="700">B̅ₖΔuₖ couples Δu and x̅</text>
<text x="171" y="136" class="note" font-weight="700">∂L/∂Δuₖ = 0:</text>
<rect x="28" y="144" width="286" height="44" rx="5" class="bad"/>
<text x="171" y="160" class="eq" >(Wᵈu+ρB̅ᵀB̅)Δu=ρB̅ᵀ(x̅ₖ₊₁−Āx̅−ē)</text>
<text x="171" y="178" class="note" fill="#b91c1c">contains x̅ₖ₊₁ ← coupled</text>
<path d="M 171 188 L 171 196" stroke="#e85d5d" stroke-width="2" fill="none" marker-end="url(#aR)"/>
<text x="171" y="208" class="note" font-weight="700">∂L/∂x̅ₖ₊₁ = 0:</text>
<rect x="28" y="216" width="286" height="44" rx="5" class="bad"/>
<text x="171" y="232" class="eq" >(Q̅+ρI+ρĀᵀĀ)x̅=rhs−ρĀᵀB̅Δu</text>
<text x="171" y="250" class="note" fill="#b91c1c">contains Δuₖ ← coupled</text>
<text x="171" y="270" class="red-key" >⇓ solve jointly across all N steps</text>
<rect x="126" y="278" width="18" height="18" rx="3" class="kF"/>
<text x="135" y="292" class="kL" >Q+ρI</text>
<rect x="146" y="278" width="18" height="18" rx="3" class="kF"/>
<text x="155" y="292" class="kL" >ρA</text>
<rect x="166" y="278" width="18" height="18" rx="3" class="k0"/>
<text x="175" y="292" class="k0L" >0</text>
<rect x="186" y="278" width="18" height="18" rx="3" class="k0"/>
<text x="195" y="292" class="k0L" >0</text>
<rect x="126" y="298" width="18" height="18" rx="3" class="kF"/>
<text x="135" y="312" class="kL" >ρA</text>
<rect x="146" y="298" width="18" height="18" rx="3" class="kF"/>
<text x="155" y="312" class="kL" >Q+ρI</text>
<rect x="166" y="298" width="18" height="18" rx="3" class="kF"/>
<text x="175" y="312" class="kL" >ρA</text>
<rect x="186" y="298" width="18" height="18" rx="3" class="k0"/>
<text x="195" y="312" class="k0L" >0</text>
<rect x="126" y="318" width="18" height="18" rx="3" class="k0"/>
<text x="135" y="332" class="k0L" >0</text>
<rect x="146" y="318" width="18" height="18" rx="3" class="kF"/>
<text x="155" y="332" class="kL" >ρA</text>
<rect x="166" y="318" width="18" height="18" rx="3" class="kF"/>
<text x="175" y="332" class="kL" >Q+ρI</text>
<rect x="186" y="318" width="18" height="18" rx="3" class="kF"/>
<text x="195" y="332" class="kL" >ρA</text>
<rect x="126" y="338" width="18" height="18" rx="3" class="k0"/>
<text x="135" y="352" class="k0L" >0</text>
<rect x="146" y="338" width="18" height="18" rx="3" class="k0"/>
<text x="155" y="352" class="k0L" >0</text>
<rect x="166" y="338" width="18" height="18" rx="3" class="kF"/>
<text x="175" y="352" class="kL" >ρA</text>
<rect x="186" y="338" width="18" height="18" rx="3" class="kF"/>
<text x="195" y="352" class="kL" >Q+ρI</text>
<text x="214" y="322" class="eq" fill="#e85d5d" font-size="16">···</text>
<rect x="94" y="364" width="144" height="20" rx="5" class="dbad"/>
<text x="166" y="378" class="dbad-t" >N·nₓ × N·nₓ — grows with N</text>
<rect x="28" y="390" width="286" height="36" rx="6" class="bad"/>
<text x="171" y="406" class="tA" font-size="13">Assemble + Factor  O(N·nₓ³)</text>
<text x="171" y="420" class="note" fill="#b91c1c">every MPC step</text>
<rect x="344" y="56" width="500" height="370" rx="10" class="pB"/>
<text x="594" y="76" class="tB" >πMPC  (vₖ = B̅ₖΔuₖ)</text>
<text x="594" y="92" class="note" font-weight="700">B̅ₖ absorbed into vₖ — three separate penalties, each involving one variable:</text>
<rect x="358" y="100" width="228" height="36" rx="5" class="good"/>
<text x="472" y="114" class="eq" font-size="12">ρ/2‖B̅ₖΔuₖ−vₖ+βₖ‖²</text>
<text x="472" y="128" class="note" fill="#1d4ed8" font-weight="700">only Δuₖ</text>
<rect x="594" y="100" width="228" height="36" rx="5" class="good"/>
<text x="708" y="114" class="eq" font-size="12">ρ/2‖x̅ₖ₊₁−zₖ₊₁+θₖ‖²</text>
<text x="708" y="128" class="note" fill="#1d4ed8" font-weight="700">only x̅ₖ₊₁</text>
<rect x="358" y="142" width="472" height="34" rx="5" class="good"/>
<text x="594" y="155" class="eq" >ρ/2‖zₖ₊₁−Āₖx̅ₖ−vₖ−ēₖ‖²</text>
<text x="594" y="169" class="note" fill="#0f9d8a" font-weight="700">vₖ is a frozen copy — B̅ not present</text>
<text x="594" y="190" class="note" font-weight="700">Gradient conditions now decouple — solve each independently:</text>
<rect x="358" y="204" width="228" height="120" rx="5" class="good"/>
<text x="472" y="222" class="note" font-weight="700" font-size="13">∂L/∂Δuₖ = 0</text>
<text x="472" y="244" class="eq" font-size="13">(Wᵈu+ρB̅ᵀB̅)Δuₖ=ρB̅ᵀ(vₖ−βₖ)</text>
<text x="472" y="266" class="note" fill="#1d4ed8" font-weight="700">x̅ absent — independent</text>
<rect x="364" y="294" width="216" height="22" rx="5" class="dgood"/>
<text x="472" y="309" class="dgood-t" >nᵤ × nᵤ ✔</text>
<rect x="594" y="204" width="228" height="120" rx="5" class="good"/>
<text x="708" y="222" class="note" font-weight="700" font-size="13">∂L/∂x̅ₖ₊₁ = 0</text>
<text x="708" y="244" class="eq" font-size="13">(Q̅+ρI+ρĀᵀĀ)x̅ₖ₊₁=rhs</text>
<text x="708" y="266" class="note" fill="#1d4ed8" font-weight="700">Δu absent — independent</text>
<rect x="600" y="294" width="216" height="22" rx="5" class="dgood"/>
<text x="708" y="309" class="dgood-t" >(nₓ+nᵤ)×(nₓ+nᵤ) ✔</text>
<text x="594" y="346" class="tB" font-size="14">Both fixed size — independent of N</text>
<text x="594" y="364" class="note" fill="#1d4ed8">Invert once offline. Reuse every ADMM iteration.</text>
<rect x="862" y="56" width="322" height="370" rx="10" class="pC"/>
<text x="1023" y="76" class="tC" >Precomputed once</text>
<text x="1023" y="90" class="note" >fixed size — N=10 or N=500: same cost</text>
<rect x="874" y="102" width="298" height="82" rx="7" class="inv"/>
<rect x="1134" y="108" width="40" height="14" rx="7" class="once"/>
<text x="1154" y="118" class="once-t" >once ✓</text>
<text x="1023" y="126" class="inv-name" >Jₖ</text>
<text x="1023" y="146" class="inv-eq" >(Wᵈu+ρB̅ᵀB̅)⁻¹B̅ᵀ</text>
<text x="1023" y="160" class="inv-use" >size: nᵤ×(nₓ+nᵤ)</text>
<rect x="874" y="168" width="298" height="14" rx="4" class="dgood"/>
<text x="1023" y="179" class="dgood-t" font-size="10">Δuₖ = Jₖ·(v̂−β̂)</text>
<rect x="874" y="192" width="298" height="82" rx="7" class="inv"/>
<rect x="1134" y="198" width="40" height="14" rx="7" class="once"/>
<text x="1154" y="208" class="once-t" >once ✓</text>
<text x="1023" y="216" class="inv-name" >H_A</text>
<text x="1023" y="236" class="inv-eq" >(Q̅+ρI+ρĀᵀĀ)⁻¹</text>
<text x="1023" y="250" class="inv-use" >size: (nₓ+nᵤ)²</text>
<rect x="874" y="258" width="298" height="14" rx="4" class="dgood"/>
<text x="1023" y="269" class="dgood-t" font-size="10">x̅ₖ₊₁ = H_A·hₖ</text>
<rect x="874" y="282" width="298" height="82" rx="7" class="inv"/>
<rect x="1134" y="288" width="40" height="14" rx="7" class="once"/>
<text x="1154" y="298" class="once-t" >once ✓</text>
<text x="1023" y="306" class="inv-name" >H_AN</text>
<text x="1023" y="326" class="inv-eq" >(Q̅+ρI)⁻¹</text>
<text x="1023" y="340" class="inv-use" >size: (nₓ+nᵤ)²</text>
<rect x="874" y="348" width="298" height="14" rx="4" class="dgood"/>
<text x="1023" y="359" class="dgood-t" font-size="10">x̅_N = H_AN·h_N</text>
<rect x="874" y="374" width="298" height="38" rx="6" class="good"/>
<text x="1023" y="389" class="tC" font-size="12">ADMM loop (×N, parallel)</text>
<text x="1023" y="403" class="inv-eq" font-size="10">matmul only — no assembly, no factor</text>
<path d="M 332 241 L 338 241" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#aP)"/>
<text x="335" y="233" class="note" >vs.</text>
<path d="M 850 241 L 856 241" stroke="#0f9d8a" stroke-width="2" fill="none" marker-end="url(#aG)"/>
<text x="853" y="233" class="note" fill="#065f46" font-weight="700">result</text>
<rect x="14" y="440" width="1172" height="26" rx="7" class="sumbar"/>
<text x="600" y="457" class="sumtxt" >vₖ=B̅ₖΔuₖ absorbs B̅ → Δu and x̅ decouple → J_k, H_A, H_AN are (nₓ+nᵤ)-sized — no N-growing matrix ever assembled or factored</text>
</svg>